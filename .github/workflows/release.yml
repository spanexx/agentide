name: release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '*-v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/heads/')
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    name: pnpm -r publish
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - run: pnpm install --frozen-lockfile
      - name: Build all ESM packages (CJS variants skip — broken build deps)
        run: |
          pnpm -r --filter './packages/errors' --filter './packages/event-bus' --filter './packages/origin' --filter './packages/session-manager' --filter './packages/capability-registry' --filter './packages/plugin-manager' --filter './packages/backend-runtime' --filter './packages/platform-capabilities' --filter './packages/gateway-core' --filter './packages/sdk-node' --filter './packages/sdk-browser' --filter './packages/adapter-mcp' --filter './packages/adapter-websocket' --filter './packages/agentide' build
      - name: Mirror CJS variants to ESM versions
        run: node packages/agentide/scripts/mirror-cjs-versions.mjs
      - name: Write .npmrc with legacy token (pnpm 11.10.0 OIDC fallback)
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to npm (ESM only — CJS variants skipped due to broken build)
        run: |
          pnpm -r --filter './packages/errors' --filter './packages/event-bus' --filter './packages/origin' --filter './packages/session-manager' --filter './packages/capability-registry' --filter './packages/plugin-manager' --filter './packages/backend-runtime' --filter './packages/platform-capabilities' --filter './packages/gateway-core' --filter './packages/sdk-node' --filter './packages/sdk-browser' --filter './packages/adapter-mcp' --filter './packages/adapter-websocket' --filter './packages/agentide' publish --access public --no-git-checks
      - name: Commit the bumped package.json files back to the repo
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add packages/*/package.json
          if git diff --cached --quiet; then
            echo "No package.json changes to commit."
          else
            git commit -m "chore(release): bump per-package versions after publish"
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
