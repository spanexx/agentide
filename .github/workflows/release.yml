name: release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    name: pnpm -r publish
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - run: pnpm install --frozen-lockfile
      - name: Check if manifest changed (release-ready)
        id: manifest_changed
        run: |
          if git diff --quiet HEAD~1 HEAD -- .github/release-please-manifest.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mirror CJS variants to ESM versions
        if: steps.manifest_changed.outputs.changed == 'true'
        run: node packages/agentide/scripts/mirror-cjs-versions.mjs
      - name: Publish to npm
        if: steps.manifest_changed.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r publish --access public --no-git-checks
      - name: Revert prepare-publish.sh mutation
        if: steps.manifest_changed.outputs.changed == 'true'
        run: git checkout -- packages/agentide/package.json
