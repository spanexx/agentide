name: release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '*-v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/heads/')
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    name: pnpm -r publish
    needs: release-please
    if: github.event_name == 'push' && (startsWith(github.event.ref, 'refs/tags/') || needs.release-please.outputs.release_created) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - run: pnpm install --frozen-lockfile
      - name: Mirror CJS variants to ESM versions
        run: node packages/agentide/scripts/mirror-cjs-versions.mjs
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r publish --access public --no-git-checks
      - name: Revert prepare-publish.sh mutation
        run: git checkout -- packages/agentide/package.json
