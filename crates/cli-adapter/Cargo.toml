[package]
name = "cli-adapter"
version = "0.1.0"
edition = "2021"
description = "Remote gateway CLI adapter — Agentide platform binary"
license = "Apache-2.0"

[[bin]]
name = "platform"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
