[package]
name = "cli-adapter"
version = "0.1.0"
edition = "2021"
description = "Remote gateway CLI adapter — Agentide platform binary"
license = "Apache-2.0"

[[bin]]
name = "platform"
path = "src/main.rs"

[dependencies]
# Phase 6 (watch) only; the `termination` feature gives SIGTERM → exit 5.
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
rpassword = "7.5.4"
# rustls pinned exactly so we control the crypto provider (tungstenite 0.30
# does not enable one itself — see rustls CryptoProvider docs). Ring only.
rustls = { version = "=0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
